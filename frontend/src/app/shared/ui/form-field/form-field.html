<div class="form-field">
  <label
    class="form-field__label"
    [for]="controlId()"
  >
    {{ label() }}

    @if (state().required()) {
      <span
        class="form-field__required"
        aria-hidden="true"
      >
        *
      </span>
    }
  </label>

  <div class="form-field__control">
    <ng-content />
  </div>

  @if (state().touched() && state().invalid()) {
    <app-validation-messages
      [errors]="state().errors()"
    />
  }
</div>
